services:
  backend:
    build: ./backend
    ports:
      - '3001:3001'
    env_file:
      - .env
    environment:
      - SQLITE_PATH=
      - CORS_ORIGIN=http://localhost:5173
    volumes:
      - lore-data:/app/data
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://localhost:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build: ./frontend
    ports:
      - '5173:5173'
    environment:
      - VITE_API_BASE_URL=http://localhost:3001
    depends_on:
      - backend

volumes:
  lore-data: